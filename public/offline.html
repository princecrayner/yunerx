<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yunerx - No Connection</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f5f7fb;
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.offline-box {
    text-align: center;
    max-width: 340px;
}

.offline-icon {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #eef2fb;
    color: #4169e1;
    font-size: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

.offline-box h1 {
    font-size: 20px;
    color: #1a1a1a;
    margin-bottom: 10px;
}

.offline-box p {
    font-size: 14px;
    color: #777;
    line-height: 1.5;
    margin-bottom: 24px;
}

.retry-btn {
    background: #4169e1;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.retry-btn:hover {
    background: #3557c7;
}

</style>

</head>
<body>

<div class="offline-box">

    <div class="offline-icon">📡</div>

    <h1>No Internet Connection</h1>

    <p>Yunerx needs an internet connection to load chats, groups, and study materials. Please check your connection and try again.</p>

    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>

</div>

</body>
</html>
